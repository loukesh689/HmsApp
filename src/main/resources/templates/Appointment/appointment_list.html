<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital · Appointment List</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(145deg, #00c6fb 0%, #005bea 40%, #6a11cb 80%, #ff6b6b 100%);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated medical background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.15) 0%, transparent 25%),
                radial-gradient(circle at 90% 70%, rgba(255,215,0,0.1) 0%, transparent 30%),
                radial-gradient(circle at 30% 80%, rgba(106,17,203,0.15) 0%, transparent 35%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 12px);
            pointer-events: none;
            z-index: 0;
            animation: backgroundShift 30s linear infinite;
        }

        @keyframes backgroundShift {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(1deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Floating medical icons */
        .floating-icon {
            position: fixed;
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            z-index: 0;
            animation: floatAround 25s linear infinite;
        }

        @keyframes floatAround {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.2; }
            25% { transform: translate(30px, 40px) rotate(15deg); opacity: 0.3; }
            50% { transform: translate(50px, 0) rotate(25deg); opacity: 0.2; }
            75% { transform: translate(30px, -40px) rotate(15deg); opacity: 0.3; }
            100% { transform: translate(0, 0) rotate(0deg); opacity: 0.2; }
        }

        .icon-1 { top: 5%; left: 3%; animation-delay: 0s; }
        .icon-2 { top: 15%; right: 5%; animation-delay: 3s; }
        .icon-3 { bottom: 10%; left: 7%; animation-delay: 6s; }
        .icon-4 { bottom: 20%; right: 8%; animation-delay: 9s; }
        .icon-5 { top: 40%; left: 12%; animation-delay: 12s; }
        .icon-6 { top: 60%; right: 12%; animation-delay: 15s; }
        .icon-7 { bottom: 30%; left: 20%; animation-delay: 18s; }
        .icon-8 { top: 75%; right: 20%; animation-delay: 21s; }
        .icon-9 { top: 25%; left: 25%; animation-delay: 24s; }
        .icon-10 { bottom: 40%; right: 25%; animation-delay: 27s; }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
        }

        /* Glass Card - Premium Design */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 70px 30px 70px 30px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            padding: 40px 40px 50px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4),
                        0 0 0 5px rgba(255, 255, 255, 0.5),
                        0 0 60px #00eaff,
                        inset 0 0 40px rgba(255, 255, 255, 0.8);
            animation: cardPulse 6s ease-in-out infinite;
            position: relative;
        }

        @keyframes cardPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.01); }
        }

        /* Decorative corner elements */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, rgba(0,230,255,0.4), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .glass-card::after {
            content: '';
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, rgba(255,215,0,0.4), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Header Section */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
            position: relative;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298, #667eea, #764ba2, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
        }

        h2 i {
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 15px;
            font-size: 3rem;
            filter: drop-shadow(0 0 15px gold);
        }

        /* Add Button */
        .btn-add {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5, #6a11cb, #ff6b6b);
            background-size: 300% 300%;
            border: none;
            border-radius: 60px;
            padding: 15px 35px;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
            transition: 0.5s;
            box-shadow: 0 20px 40px rgba(0,210,255,0.4),
                        0 0 0 3px rgba(255,255,255,0.5),
                        0 0 30px #00eaff;
            border: 2px solid rgba(255,255,255,0.8);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .btn-add i {
            font-size: 1.4rem;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .btn-add:hover {
            background-position: 100% 0;
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 30px 60px rgba(106,17,203,0.5), 0 0 0 5px rgba(255,255,255,0.8), 0 0 60px #ff6b6b;
            color: white;
            text-decoration: none;
        }

        /* Table Container */
        .table-responsive {
            border-radius: 50px 20px 50px 20px;
            overflow: hidden;
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            padding: 5px;
        }

        /* Custom Table */
        .custom-table {
            width: 100%;
            background: transparent;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin: 0;
        }

        .custom-table thead {
            background: linear-gradient(145deg, #1e3c72, #2a5298, #667eea);
            border-radius: 50px 50px 0 0;
        }

        .custom-table thead th {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
            border: none;
            padding: 18px 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .custom-table thead th:first-child {
            border-radius: 40px 0 0 40px;
        }

        .custom-table thead th:last-child {
            border-radius: 0 40px 40px 0;
        }

        .custom-table tbody tr {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50px;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .custom-table tbody tr:hover {
            transform: scale(1.02) translateY(-5px);
            background: white;
            box-shadow: 0 20px 40px rgba(102,126,234,0.3), 0 0 0 3px rgba(255,255,255,0.8);
            cursor: pointer;
        }

        .custom-table tbody td {
            padding: 18px 15px;
            border: none;
            color: #2c3e50;
            font-weight: 500;
            font-size: 1rem;
        }

        .custom-table tbody td:first-child {
            border-radius: 40px 0 0 40px;
        }

        .custom-table tbody td:last-child {
            border-radius: 0 40px 40px 0;
        }

        /* ID Badge */
        .id-badge {
            display: inline-block;
            width: 45px;
            height: 45px;
            background: linear-gradient(145deg, #00d2ff, #3a7bd5);
            color: white;
            border-radius: 20px 5px 20px 5px;
            text-align: center;
            line-height: 45px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 8px 15px rgba(0,210,255,0.3);
        }

        /* Patient Name */
        .patient-name {
            font-weight: 700;
            color: #1e3c72;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .patient-name i {
            color: #00d2ff;
            font-size: 1.3rem;
        }

        /* Doctor Name */
        .doctor-name {
            font-weight: 600;
            color: #6a11cb;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .doctor-name i {
            color: #ff6b6b;
            font-size: 1.3rem;
        }

        /* Date Badge */
        .badge-date {
            background: linear-gradient(145deg, #11998e, #38ef7d);
            color: white;
            padding: 10px 18px;
            border-radius: 30px 8px 30px 8px;
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 15px rgba(17,153,142,0.3);
        }

        .badge-date i {
            font-size: 1rem;
        }

        /* Delete Button */
        .btn-delete {
            background: linear-gradient(145deg, #ff416c, #ff4b2b);
            color: white;
            border-radius: 30px 8px 30px 8px;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 8px 15px rgba(255,75,43,0.3);
        }

        .btn-delete i {
            font-size: 1.1rem;
        }

        .btn-delete:hover {
            background: linear-gradient(145deg, #ff4b2b, #ff416c);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(255,65,108,0.5), 0 0 0 3px rgba(255,255,255,0.8);
            color: white;
            text-decoration: none;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 30px;
            background: rgba(255,255,255,0.9);
            border-radius: 60px 20px 60px 20px;
        }

        .empty-state i {
            font-size: 6rem;
            background: linear-gradient(135deg, #00d2ff, #6a11cb, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .empty-state p {
            font-size: 1.8rem;
            color: #1e3c72;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .empty-state .btn-add {
            display: inline-flex;
            margin-top: 20px;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            h2 {
                font-size: 2.2rem;
            }

            .glass-card {
                padding: 30px 20px;
            }
        }

        @media (max-width: 768px) {
            .header-section {
                flex-direction: column;
                text-align: center;
            }

            h2 {
                font-size: 2rem;
            }

            .btn-add {
                width: 100%;
                justify-content: center;
            }

            .custom-table thead {
                display: none;
            }

            .custom-table tbody tr {
                display: block;
                margin-bottom: 25px;
                padding: 20px;
            }

            .custom-table tbody td {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 15px;
                border-bottom: 1px solid rgba(0,0,0,0.05);
            }

            .custom-table tbody td:before {
                content: attr(data-label);
                font-weight: 700;
                color: #1e3c72;
                margin-right: 15px;
            }

            .custom-table tbody td:last-child {
                border-bottom: none;
            }

            .floating-icon {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 1.6rem;
            }

            h2 i {
                font-size: 2rem;
            }

            .btn-add {
                font-size: 1rem;
                padding: 12px 25px;
            }
        }

        /* Selection Styling */
        ::selection {
            background: #6a11cb;
            color: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: linear-gradient(145deg, #1e3c72, #2a5298);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(145deg, #00d2ff, #6a11cb);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(145deg, #6a11cb, #ff6b6b);
        }
    </style>
</head>
<body>

<!-- Floating Medical Icons -->
<div class="floating-icon icon-1"><i class="fas fa-heartbeat"></i></div>
<div class="floating-icon icon-2"><i class="fas fa-stethoscope"></i></div>
<div class="floating-icon icon-3"><i class="fas fa-pills"></i></div>
<div class="floating-icon icon-4"><i class="fas fa-syringe"></i></div>
<div class="floating-icon icon-5"><i class="fas fa-hospital"></i></div>
<div class="floating-icon icon-6"><i class="fas fa-ambulance"></i></div>
<div class="floating-icon icon-7"><i class="fas fa-thermometer"></i></div>
<div class="floating-icon icon-8"><i class="fas fa-clock"></i></div>
<div class="floating-icon icon-9"><i class="fas fa-calendar-check"></i></div>
<div class="floating-icon icon-10"><i class="fas fa-file-invoice"></i></div>

<div class="container">
    <div class="glass-card shadow-lg">
        <!-- Header Section -->
        <div class="header-section">
            <h2>
                <i class="fas fa-calendar-alt"></i>
                WORLD HOSPITAL
                <i class="fas fa-globe"></i>
            </h2>
            <a th:href="@{/appointment}" class="btn-add">
                <i class="fas fa-plus-circle"></i>
                Book New Appointment
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>

        <!-- Table Section -->
        <div class="table-responsive">
            <table class="table custom-table table-hover align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient Name</th>
                    <th>Doctor Name</th>
                    <th>Appointment Date</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appointment : ${appointments}" th:attr="data-label='row'">
                    <td data-label="ID">
                        <span class="id-badge" th:text="${appointment.id}">1</span>
                    </td>
                    <td data-label="Patient Name">
                                <span class="patient-name">
                                    <i class="fas fa-user-circle"></i>
                                    <span th:text="${appointment.patient_name}"></span>
                                </span>
                    </td>
                    <td data-label="Doctor Name">
                                <span class="doctor-name">
                                    <i class="fas fa-user-md"></i>
                                    <span th:text="${appointment.doctor_name}"></span>
                                </span>
                    </td>
                    <td data-label="Appointment Date">
                                <span class="badge-date">
                                    <i class="fas fa-calendar-day"></i>
                                    <span th:text="${appointment.date}"></span>
                                </span>
                    </td>
                    <td data-label="Action">
                        <a th:href="@{'/appointment/delete/' + ${appointment.id}}"
                           class="btn-delete"
                           onclick="return confirm('⚠️ Are you sure you want to delete this appointment?')">
                            <i class="fas fa-trash-alt"></i>
                            Delete
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="5" class="text-center">
                        <div class="empty-state">
                            <i class="fas fa-calendar-times"></i>
                            <p>No Appointments Found! 📋</p>
                            <p style="font-size: 1.2rem; color: #666;">Start by booking your first appointment</p>
                            <a th:href="@{/appointment}" class="btn-add">
                                <i class="fas fa-plus-circle"></i>
                                Book Now
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer Stats -->
        <div th:if="${!#lists.isEmpty(appointments)}" style="margin-top: 30px; text-align: center;">
                <span style="background: rgba(255,255,255,0.9); padding: 12px 30px; border-radius: 60px; font-weight: 600; color: #1e3c72;">
                    <i class="fas fa-chart-line" style="color: #00d2ff; margin-right: 10px;"></i>
                    Total Appointments: <span th:text="${#lists.size(appointments)}" style="font-weight: 800; color: #6a11cb;">0</span>
                </span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Optional JavaScript for enhanced interactions -->
<script>
    // Confirm delete with style
    document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', function(e) {
            if (!confirm('⚠️ Are you sure you want to delete this appointment?\nThis action cannot be undone!')) {
                e.preventDefault();
            }
        });
    });

    // Add row click effect
    document.querySelectorAll('.custom-table tbody tr').forEach(row => {
        row.addEventListener('click', function(e) {
            if (!e.target.closest('a')) {
                this.style.backgroundColor = 'rgba(102,126,234,0.2)';
                setTimeout(() => {
                    this.style.backgroundColor = '';
                }, 200);
            }
        });
    });

    // Responsive floating icons
    function adjustIcons() {
        if (window.innerWidth < 768) {
            document.querySelectorAll('.floating-icon').forEach(icon => {
                icon.style.opacity = '0.1';
            });
        } else {
            document.querySelectorAll('.floating-icon').forEach(icon => {
                icon.style.opacity = '';
            });
        }
    }

    window.addEventListener('resize', adjustIcons);
    adjustIcons();
</script>

</body>
</html>
