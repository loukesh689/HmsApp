<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula · Update Doctor</title>

    <!-- Bootstrap 4 + Font Awesome 5 + Google Fonts for universal vibe -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* 🌌✨ UNIVERSE + IMAGINE + HOSPITAL — complete redesign, colourful, attractive, deep space */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse at 30% 40%, #0d0221 0%, #1f0c3a 40%, #2f1b54 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            color: #fff;
            padding: 20px 0;
        }

        /* 🌠 cosmic animated layers: stars, twinkling, nebulae */
        .stars, .twinkling, .nebulae {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            z-index: 0;
        }

        .stars {
            background: #000 url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjQwIiByPSIxLjUiIGZpbGw9IndoaXRlIiAvPjxjaXJjbGUgY3g9IjE4MCIgY3k9IjEwMCIgcj0iMiIgZmlsbD0id2hpdGUiIC8+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMjAiIHI9IjEuOCIgZmlsbD0id2hpdGUiIC8+PC9zdmc+');
            background-size: 400px 400px;
            animation: pulseStar 12s infinite alternate;
        }

        .twinkling {
            background: transparent url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48Y2lyY2xlIGN4PSI4MCIgY3k9IjE4MCIgcj0iMi4yIiBmaWxsPSIjZmZmZjgwIiBvcGFjaXR5PSIwLjgiIC8+PC9zdmc+');
            background-size: 300px 300px;
            animation: twinkle 6s infinite;
        }

        .nebulae {
            background: radial-gradient(circle at 20% 30%, rgba(170, 90, 240, 0.2) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(80, 180, 250, 0.2) 0%, transparent 40%),
                        radial-gradient(circle at 40% 80%, #ffb3c6 0%, transparent 40%);
            opacity: 0.5;
            animation: nebulaGlow 18s infinite alternate;
        }

        @keyframes pulseStar {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        @keyframes twinkle {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
        @keyframes nebulaGlow {
            0% { opacity: 0.3; filter: blur(2px); }
            100% { opacity: 0.7; filter: blur(5px); }
        }

        /* floating planets (imaginative) */
        .floating-planet {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.2;
            z-index: 1;
            animation: planetFloat 25s infinite alternate;
        }
        .planet-a {
            width: 500px; height: 500px; top: -150px; right: -100px;
            background: radial-gradient(circle, #ff94b6, #ad64ff);
        }
        .planet-b {
            width: 600px; height: 600px; bottom: -200px; left: -150px;
            background: radial-gradient(circle, #6ed4ff, #715aff);
            opacity: 0.15;
            animation-duration: 35s;
        }
        .planet-c {
            width: 300px; height: 300px; top: 20%; left: 10%;
            background: #fdbb7a;
            filter: blur(60px);
            opacity: 0.2;
        }
        @keyframes planetFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.2); }
        }

        /* main container above cosmic layers */
        .container {
            position: relative;
            z-index: 20;
        }

        /* NAVBAR — fully colourful, universal */
        .galaxy-navbar {
            background: linear-gradient(90deg, #1f0b3a, #412b70, #1b254b);
            box-shadow: 0 20px 35px #7b41bb, 0 0 0 2px #bc93ff, 0 0 30px #a05eff;
            border-bottom: 3px solid #d8b1ff;
            padding: 0.9rem 2rem;
            z-index: 30;
        }
        .navbar-brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 2.3rem;
            color: #fff9e6 !important;
            text-shadow: 0 0 15px #f4c3ff, 3px 3px 0 #3e1e7c, 5px 5px 0 #200b44;
            letter-spacing: 2px;
        }
        .navbar-brand i {
            color: #ffdb8e;
            filter: drop-shadow(0 0 10px gold);
            margin-right: 12px;
        }
        .nav-link {
            font-weight: 600;
            background: rgba(220, 190, 255, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            color: #ffeefc !important;
            border: 2px solid #f1c6ff;
            margin-left: 15px;
            padding: 8px 25px !important;
            transition: 0.3s;
        }
        .nav-link:hover {
            background: #fff2d7;
            color: #281447 !important;
            transform: scale(1.07);
            box-shadow: 0 0 30px #f1b4ff;
        }

        /* CARD — from dark to cosmic glass */
        .cosmic-update-card {
            background: rgba(12, 5, 28, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 70px 70px 40px 70px;
            border: 2px solid rgba(210, 150, 250, 0.9);
            box-shadow: 0 40px 70px rgba(179, 97, 255, 0.6), 0 0 0 4px #f3ceff, inset 0 0 50px #b47cf0;
            padding: 2rem 2rem;
            transition: transform 0.3s;
        }

        .cosmic-update-card:hover {
            transform: scale(1.01);
        }

        /* supernova title */
        .supernova-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 2.7rem;
            background: linear-gradient(45deg, #fdbcff, #b3c6ff, #abf0e9, #ffcf9a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px #f3aaff, 0 0 80px #b87aff;
            letter-spacing: 3px;
            margin-bottom: 1.8rem;
            text-align: center;
        }

        .supernova-title i {
            color: #ffdb7c;
            filter: drop-shadow(0 0 20px gold);
            margin: 0 10px;
        }

        /* form labels — constellation style */
        .form-group label {
            font-weight: 600;
            font-size: 1.2rem;
            background: rgba(136, 85, 199, 0.5);
            backdrop-filter: blur(5px);
            padding: 0.5rem 2rem;
            border-radius: 50px;
            color: #ffffff;
            border-left: 10px solid #ffb3d9;
            border-right: 4px solid #cb9eff;
            box-shadow: 0 0 20px #c17eff, 0 6px 0 #572e8b;
            display: inline-block;
            margin-bottom: 0.8rem;
        }

        .form-group label i {
            color: #ffde9e;
            margin-right: 12px;
            font-size: 1.5rem;
            filter: drop-shadow(0 0 5px #fff);
        }

        /* input fields — galaxy dark matter */
        .form-control, select.form-control, input[type="number"] {
            background: rgba(20, 5, 45, 0.8);
            border: 3px solid #ad73e6;
            border-radius: 50px;
            padding: 0.9rem 2rem;
            font-size: 1.15rem;
            color: #f3e5ff;
            font-weight: 500;
            box-shadow: inset 0 0 30px #371c5e, 0 8px 25px #a557e0;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .form-control:focus, select:focus, input[type="number"]:focus {
            background: #1f0d3b;
            border-color: #f2b0ff;
            box-shadow: 0 0 0 7px rgba(210, 130, 255, 0.5), 0 0 40px #cf86f5;
            transform: translateY(-3px);
            color: #fff;
        }

        /* select custom arrow (cosmic) */
        select.form-control {
            background: rgba(20, 5, 45, 0.8) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24' fill='%23e3b0ff'><path d='M7 10l5 5 5-5z'/></svg>") no-repeat right 1.5rem center;
            appearance: none;
            -webkit-appearance: none;
        }

        /* submit button — blast off */
        .btn-cosmic-blast {
            background: linear-gradient(45deg, #b35cf2, #d569b0, #fa9e8c, #c164e3);
            background-size: 300% 300%;
            border: none;
            border-radius: 60px;
            padding: 1.2rem 2.2rem;
            font-weight: 800;
            font-size: 2.1rem;
            font-family: 'Orbitron', sans-serif;
            color: #fffde7;
            text-shadow: 0 2px 0 #590f87, 0 0 40px white;
            box-shadow: 0 30px 40px #9e46cb, 0 0 0 5px #f9dbff, 0 0 90px #cf86fc;
            transition: 0.4s;
            width: 100%;
            letter-spacing: 4px;
            border: 3px solid #fce3b0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 1.8rem;
        }

        .btn-cosmic-blast i {
            font-size: 2.5rem;
            color: #fff2b5;
            filter: drop-shadow(0 0 15px gold);
        }

        .btn-cosmic-blast:hover {
            background-position: 100% 0;
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 45px 55px #c258d2, 0 0 0 8px #fff1b0, 0 0 120px #eaacff;
            color: #fffff0;
        }

        /* imagine & universe footer quote */
        .imagine-quote {
            margin-top: 25px;
            text-align: center;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 15px 20px;
            border: 2px solid #c296ff;
            color: #f0d4ff;
            font-size: 1.3rem;
        }

        /* remove old bg */
        .bg-dark, .dark-navbar, .dark-card {
            background: transparent !important;
        }
        .card {
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>
<!-- cosmic background layers -->
<div class="stars"></div>
<div class="twinkling"></div>
<div class="nebulae"></div>
<div class="floating-planet planet-a"></div>
<div class="floating-planet planet-b"></div>
<div class="floating-planet planet-c"></div>

<!-- galaxy navbar (redesigned, attractive, universal) -->
<nav class="navbar navbar-expand-md galaxy-navbar">
    <a class="navbar-brand" href="#">
        <i class="fas fa-rocket"></i> STAR·HOSPITAL <i class="fas fa-star"></i>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon" style="color:#fff; background:white; border-radius:5px;"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/patient}">
                    <i class="fas fa-user-md"></i> Doctor Management
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#"><i class="fas fa-globe"></i> Galaxy</a>
            </li>
        </ul>
    </div>
</nav>

<br><br>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9 col-sm-12">
            <!-- cosmic update card (instead of old dark card) -->
            <div class="cosmic-update-card">
                <h2 class="supernova-title">
                    <i class="fas fa-pen-fancy"></i> UPDATE DOCTOR <i class="fas fa-stethoscope"></i>
                </h2>

                <!-- form with thymeleaf object doctor (universe edition) -->
                <form th:action="@{/doctor}" th:object="${doctor}" method="post">

                    <!-- Doctor name (astronaut field) -->
                    <div class="form-group">
                        <label><i class="fas fa-user-astronaut"></i> Doctor Name</label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Dr. Orion Nova" />
                    </div>

                    <!-- Specialization (nebula select) -->
                    <div class="form-group">
                        <label for="specialization"><i class="fas fa-dna"></i> Specialization</label>
                        <select th:field="*{specialization}" id="specialization" class="form-control" required>
                            <option value="" disabled selected>🌙 select specialization</option>
                            <option value="Cardiology">❤️ Cardiology</option>
                            <option value="Dermatology">✨ Dermatology</option>
                            <option value="Neurology">🧠 Neurology</option>
                            <option value="Orthopedics">🦴 Orthopedics</option>
                            <option value="Pediatrics">👶 Pediatrics</option>
                        </select>
                    </div>

                    <!-- Fees (cosmic credits) -->
                    <div class="form-group">
                        <label for="fees"><i class="fas fa-coins"></i> Consultation Fees (⧫ credits)</label>
                        <input type="number" th:field="*{fees}" id="fees" class="form-control" placeholder="e.g. 450" min="0" step="0.01" required>
                    </div>

                    <!-- submit button — blast into universe -->
                    <button type="submit" class="btn-cosmic-blast">
                        <i class="fas fa-cloud-upload-alt"></i>  UPDATE RECORD  <i class="fas fa-rocket"></i>
                    </button>

                    <!-- imagine & universe quote -->
                    <div class="imagine-quote">
                        <i class="fas fa-crown"></i>  imagine · universe · hospital · beyond  <i class="fas fa-crown"></i>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- small spacer -->
<div style="height: 30px;"></div>

<!-- Bootstrap & jQuery (for navbar toggle) -->
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
</body>
</html>
