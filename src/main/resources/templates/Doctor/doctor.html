<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital cosmos · Doctor list</title>

    <!-- Bootstrap 5 + Font Awesome 6 (free) + Google Fonts for universal feel -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* 🌌✨ Universe + Hospital theme: imagine stars, planets, and professional card */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse at 30% 40%, #0c0b1a, #130b29, #1d1240, #070320);
            min-height: 100vh;
            color: #fff;
            padding: 20px 0;
            position: relative;
            overflow-x: hidden;
        }

        /* 🌠 starfield animation (deep universe) */
        .stars, .twinkling, .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            z-index: 0;
        }
        .stars {
            background: #000 url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48Y2lyY2xlIGN4PSI1IiBjeT0iMTUiIHI9IjEiIGZpbGw9IndoaXRlIiAvPjxjaXJjbGUgY3g9IjE4MCIgY3k9IjUwIiByPSIxLjUiIGZpbGw9IndoaXRlIiAvPjxjaXJjbGUgY3g9IjcwIiBjeT0iMjUwIiByPSIxLjgiIGZpbGw9IndoaXRlIiAvPjwvc3ZnPg==');
            background-size: 400px 400px;
            animation: starPulse 10s infinite alternate;
        }
        .twinkling {
            background: transparent url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48Y2lyY2xlIGN4PSI0MCIgY3k9IjYwIiByPSIyLjUiIGZpbGw9IiNmZmZmYzAiIG9wYWNpdHk9IjAuNyIgLz48Y2lyY2xlIGN4PSIyMjAiIGN5PSIxMjAiIHI9IjIiIGZpbGw9IndoaXRlIiBvcGFjaXR5PSIwLjgiIC8+PC9zdmc+');
            background-size: 350px 350px;
            animation: twink 5s infinite;
        }
        @keyframes starPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        @keyframes twink {
            0% { opacity: 0.2; }
            50% { opacity: 0.9; }
            100% { opacity: 0.2; }
        }

        /* planets (floating universe) */
        .planet-float {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.2;
            z-index: 1;
            animation: drift 30s infinite alternate ease-in-out;
        }
        .p1 {
            width: 500px; height: 500px; top: -200px; right: -100px;
            background: radial-gradient(circle, #c47aff, #361d70);
        }
        .p2 {
            width: 600px; height: 600px; bottom: -250px; left: -150px;
            background: radial-gradient(circle, #f09bd9, #802d7f);
            opacity: 0.15;
            animation-duration: 40s;
        }
        .p3 {
            width: 300px; height: 300px; top: 20%; left: 10%;
            background: #6a93ff;
            filter: blur(60px);
            opacity: 0.18;
        }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.2); }
        }

        /* main container above stars */
        .container {
            position: relative;
            z-index: 20;
        }

        /* title: cosmic + hospital vibes */
        .hospital-nebula-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 3.2rem;
            background: linear-gradient(120deg, #f6b5ff, #a7c5ff, #9efff2, #feda9e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px #bc8cff, 0 0 90px #a057fa, 4px 4px 0 #2c0e4a;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
        }
        .sub-clinic {
            font-size: 1.3rem;
            background: rgba(10, 2, 30, 0.6);
            backdrop-filter: blur(8px);
            display: inline-block;
            padding: 0.5rem 2.5rem;
            border-radius: 60px;
            border: 2px solid #b77cf2;
            color: #f0d6ff;
            margin-bottom: 25px;
        }

        /* BUTTON "Add Doctor" — supernova style */
        .btn-cosmic-add {
            background: linear-gradient(45deg, #7f58fe, #b56bf2, #fe8c8c, #c758d2);
            background-size: 250% 250%;
            border: 2px solid #fffcd6;
            border-radius: 60px;
            padding: 14px 35px;
            font-weight: 700;
            font-size: 1.5rem;
            color: #ffffff;
            text-shadow: 0 2px 0 #3b1760;
            box-shadow: 0 20px 30px #a44bc2, 0 0 0 3px #ffecb0, 0 0 60px #db9aff;
            transition: 0.4s;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            border: 2px solid white;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        .btn-cosmic-add i {
            font-size: 2rem;
            color: #ffebb5;
            filter: drop-shadow(0 0 10px gold);
        }

        .btn-cosmic-add:hover {
            background-position: 100% 0;
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 30px 40px #ba61d2, 0 0 0 6px #fff1b5, 0 0 100px #e7b3ff;
            color: #fffae8;
        }

        /* glass table wrapper: imagine universe inside hospital */
        .nebula-table-wrapper {
            background: rgba(18, 8, 40, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 50px;
            padding: 2rem 1.5rem;
            border: 2px solid rgba(200, 160, 255, 0.8);
            box-shadow: 0 35px 70px rgba(115, 0, 255, 0.5), inset 0 0 60px rgba(210, 160, 255, 0.4);
            margin-top: 2.5rem;
        }

        /* table design — clean, readable, but with cosmic accents */
        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 14px;
            color: #f3e9ff;
        }

        .custom-table thead th {
            font-family: 'Orbitron', sans-serif;
            background: rgba(44, 12, 82, 0.8);
            backdrop-filter: blur(10px);
            color: #fffbee;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.1rem;
            padding: 18px 12px;
            border: none;
            text-align: center;
            border-bottom: 4px solid #b77cf2;
            text-shadow: 0 2px 0 #3b1f60;
        }
        .custom-table thead th:first-child {
            border-top-left-radius: 40px;
            border-bottom-left-radius: 40px;
        }
        .custom-table thead th:last-child {
            border-top-right-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .custom-table tbody tr {
            background: rgba(35, 15, 60, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            transition: all 0.3s;
            box-shadow: 0 8px 20px #361c5e, 0 0 0 2px #d7aaff;
        }

        .custom-table tbody tr:hover {
            background: rgba(70, 30, 110, 0.8);
            transform: scale(1.01) translateY(-3px);
            box-shadow: 0 20px 30px #913acc, 0 0 0 4px #fadcff;
        }

        .custom-table td {
            padding: 18px 12px;
            vertical-align: middle;
            text-align: center;
            border: none;
            color: #ffffff;
            font-weight: 500;
            font-size: 1.15rem;
            background: transparent;
        }

        .custom-table td:first-child {
            border-top-left-radius: 40px;
            border-bottom-left-radius: 40px;
            font-weight: 700;
            background: rgba(109, 59, 159, 0.5);
        }
        .custom-table td:last-child {
            border-top-right-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        /* badge style for fees (celestial) */
        .fee-badge {
            background: radial-gradient(circle, #f7cf7c, #d98cf2);
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: #1d102b;
            box-shadow: 0 0 0 3px white;
            border: 2px solid #fbe4b0;
        }

        /* action buttons — supernova / galaxy */
        .btn-edit-cosmic {
            background: linear-gradient(145deg, #f9b84a, #ff8a7a);
            border: none;
            border-radius: 40px !important;
            padding: 9px 24px;
            font-weight: 600;
            font-size: 1rem;
            color: #1c0930;
            box-shadow: 0 4px 0 #b25e2c, 0 6px 15px #ffa36b;
            transition: 0.2s;
            margin-right: 10px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            border: 2px solid #fff3c9;
        }
        .btn-edit-cosmic:hover {
            background: linear-gradient(145deg, #ffae42, #ff7855);
            transform: translateY(-4px);
            box-shadow: 0 8px 0 #b65320, 0 12px 25px #ffa558;
            color: #130020;
        }

        .btn-delete-cosmic {
            background: linear-gradient(145deg, #ff6b8b, #d33e6f);
            border: none;
            border-radius: 40px !important;
            padding: 9px 22px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            box-shadow: 0 4px 0 #971b4b, 0 6px 15px #ff82a0;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            border: 2px solid #ffd4d4;
        }
        .btn-delete-cosmic:hover {
            background: linear-gradient(145deg, #ff527b, #c72e5a);
            transform: translateY(-4px);
            box-shadow: 0 8px 0 #7f1740, 0 12px 25px #ff6188;
            color: white;
        }

        /* "imagine" footer quote */
        .imagine-footer {
            text-align: center;
            margin: 40px 0 15px;
            font-size: 1.3rem;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 100px;
            border: 2px solid #b185ff;
            color: #dcc5ff;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        /* old classes overridden */
        .table-dark {
            background: transparent;
        }
    </style>
</head>
<body>
<!-- Universe layers (stars, twinkling, planets) -->
<div class="stars"></div>
<div class="twinkling"></div>
<div class="planet-float p1"></div>
<div class="planet-float p2"></div>
<div class="planet-float p3"></div>

<div class="container mt-4">

    <!-- Title: imagine + hospital + universe -->
    <div class="d-flex align-items-center justify-content-between flex-wrap">
        <div>
            <h1 class="hospital-nebula-title">
                <i class="fas fa-stethoscope" style="color: #ffdb8e;"></i>
                HOS·PI·UNIVERSE
            </h1>
            <span class="sub-clinic">
                    <i class="fas fa-star"></i>  galactic medical staff  <i class="fas fa-star"></i>
                </span>
        </div>
        <!-- ADD DOCTOR BUTTON (attractive, imagine, cosmic) -->
        <a th:href="@{/doctor/new}" class="btn-cosmic-add">
            <i class="fas fa-user-astronaut"></i>  Add Doctor  <i class="fas fa-rocket"></i>
        </a>
    </div>

    <!-- Table wrapper — imagine universe inside the hospital -->
    <div class="nebula-table-wrapper">
        <table class="custom-table">
            <thead>
            <tr>
                <th><i class="fas fa-hashtag"></i> ID</th>
                <th><i class="fas fa-user-md"></i> Name</th>
                <th><i class="fas fa-dna"></i> Specialization</th>
                <th><i class="fas fa-coins"></i> Fees</th>
                <th><i class="fas fa-bolt"></i> Action</th>
            </tr>
            </thead>
            <tbody>
            <!-- thymeleaf loop: doctors list (universe edition) -->
            <tr th:each="doctor : ${doctors}">
                <td><span style="background:#4b2b7a; padding:6px 22px; border-radius: 60px; font-weight: 700;" th:text="${doctor.id}">101</span></td>
                <td><i class="fas fa-user-astronaut" style="color:#f5c0ff;"></i> <span th:text="${doctor.name}">Dr. Luna</span></td>
                <td th:text="${doctor.specialization}"><span style="background:#6750a4; padding:6px 18px; border-radius: 40px;">Cardiology</span></td>
                <td><span class="fee-badge" th:text="${doctor.fees}">$350</span></td>
                <td>
                    <!-- edit button (cosmic) -->
                    <a th:href="@{/doctor/edit/{id}(id=${doctor.id})}" class="btn-edit-cosmic">
                        <i class="fas fa-pen-fancy"></i> Edit
                    </a>
                    <!-- delete button (cosmic) -->
                    <a th:href="@{/doctor/delete/{id}(id=${doctor.id})}" class="btn-delete-cosmic">
                        <i class="fas fa-trash-alt"></i> Delete
                    </a>
                </td>
            </tr>

            <!-- extra static rows to show design (will be replaced by real data) but kept for preview -->
            <tr>
                <td><span style="background:#4b2b7a; padding:6px 22px; border-radius:60px;">102</span></td>
                <td><i class="fas fa-user-astronaut" style="color:#f5c0ff;"></i> Dr. Orion</td>
                <td>Neurology</td>
                <td><span class="fee-badge">$420</span></td>
                <td>
                    <a href="#" class="btn-edit-cosmic"><i class="fas fa-pen-fancy"></i> Edit</a>
                    <a href="#" class="btn-delete-cosmic"><i class="fas fa-trash-alt"></i> Delete</a>
                </td>
            </tr>
            <tr>
                <td><span style="background:#4b2b7a; padding:6px 22px; border-radius:60px;">103</span></td>
                <td><i class="fas fa-user-astronaut" style="color:#f5c0ff;"></i> Dr. Andromeda</td>
                <td>Pediatrics</td>
                <td><span class="fee-badge">$280</span></td>
                <td>
                    <a href="#" class="btn-edit-cosmic"><i class="fas fa-pen-fancy"></i> Edit</a>
                    <a href="#" class="btn-delete-cosmic"><i class="fas fa-trash-alt"></i> Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- imagine + universe quote -->
    <div class="imagine-footer">
        <i class="fas fa-crown"></i>  imagine · universe · hospital · beyond  <i class="fas fa-crown"></i>
    </div>

</div> <!-- container -->

<!-- Bootstrap JS (optional for toggling etc) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
